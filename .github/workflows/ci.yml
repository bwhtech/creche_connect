name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server and Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Set up bench
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          echo "127.0.0.1 crecheconnect.test" | sudo tee -a /etc/hosts
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install app and demo data
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app creche_connect $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin crecheconnect.test
          bench --site crecheconnect.test install-app creche_connect
          bench --site crecheconnect.test set-config allow_tests true
          bench --site crecheconnect.test execute creche_connect.demo.make_demo
          bench build
        env:
          CI: "Yes"

      - name: Server tests
        working-directory: /home/runner/frappe-bench
        run: bench --site crecheconnect.test run-tests --app creche_connect

      - name: Start server
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/; s/^schedule:/# schedule:/' Procfile
          bench start &> bench_start.log &
          timeout 60 bash -c 'until curl -s http://crecheconnect.test:8000 > /dev/null; do sleep 2; done'

      - name: Playwright tests
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          BASE_URL: http://crecheconnect.test:8000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Show bench logs
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: cat bench_start.log logs/*.log || true
